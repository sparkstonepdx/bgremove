name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a running one finish rather than cutting
# it off halfway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The model that ships: isnet with 8-bit weights, 44 MB instead of 178 and
  # within 0.05 points of the full model on average across the fixtures. It is
  # built here from the full model rather than stored anywhere; the quantizer
  # is deterministic for the pinned toolchain, so this reproduces the exact
  # file the quality floors were measured on.
  MODEL: isnet-general-use-int8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # The source model is 178 MB. Keyed on the profile table and the
      # quantizer's toolchain, so a change to either rebuilds from scratch.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/bgremove
          key: models-${{ hashFiles('web/profiles.json', 'scripts/requirements.txt', 'scripts/quantize.py') }}

      # Frozen, so a lockfile that has drifted from package.json fails here
      # rather than quietly resolving something different in CI.
      - run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: harness
        run: pnpm test

      # The page in a real Chrome, for what the Node tests cannot see: layout,
      # the file picker, and races against the model download.
      - name: Browser test
        working-directory: harness
        run: pnpm run browser

      # Only the model being deployed, so every deploy is graded on exactly
      # what goes out.
      - name: Quality floors for the shipped model
        working-directory: harness
        run: pnpm run quality
        env:
          BGREMOVE_MODEL: ${{ env.MODEL }}

      - name: Build the static site
        run: pnpm build --model "$MODEL"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
